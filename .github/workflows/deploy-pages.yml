# Deploy the static docs/ site to GitHub Pages, injecting the Mapbox token from
# a repo secret so it never lives in the committed source.
#
# One-time setup (repo Settings):
#   - Secrets and variables → Actions → New secret: MAPBOX_TOKEN = the publishable
#     (pk.*) Mapbox token, URL-restricted to the Pages domain.
#   - Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Mapbox token into config.js
        env:
          # Passed through the environment rather than interpolated into the
          # script body, so the secret never becomes part of the shell text.
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$MAPBOX_TOKEN" ]; then
            echo "::error::MAPBOX_TOKEN secret is empty or unset — refusing to deploy a map with no token."
            exit 1
          fi
          printf 'window.CPAL_MAPBOX_TOKEN = "%s";\n' "$MAPBOX_TOKEN" > docs/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
