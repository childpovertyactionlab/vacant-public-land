# Deploy the static docs/ site to GitHub Pages, injecting the Mapbox token from
# a repo secret so it never lives in the committed source.
#
# One-time setup (repo Settings):
#   - Secrets and variables → Actions → New secret: MAPBOX_TOKEN = the publishable
#     (pk.*) Mapbox token, URL-restricted to the Pages domain.
#   - Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Mapbox token into config.js
        run: printf 'window.CPAL_MAPBOX_TOKEN = "%s";\n' "${{ secrets.MAPBOX_TOKEN }}" > docs/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
